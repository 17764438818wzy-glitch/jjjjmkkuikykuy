name: paperflow-prefect-preview

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect_preview
      POSTGRES_DB: prefect_preview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the preview database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U prefect_preview -d prefect_preview"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 1.0
    mem_limit: 768m

  server:
    image: prefecthq/prefect:3.9.0-python3.12@sha256:9f4fb20a431f0aba81bbcede83d5c08648aa769faf0ec47e989e9d370270129e
    restart: unless-stopped
    command: [prefect, server, start, --host, 0.0.0.0, --port, "4200"]
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect_preview:${POSTGRES_PASSWORD}@postgres:5432/prefect_preview
      PREFECT_UI_API_URL: http://192.168.1.120:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_HOME: /opt/prefect
    volumes:
      - prefect_data:/opt/prefect
    ports:
      - "192.168.1.120:4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    cpus: 2.0
    mem_limit: 3g

  demo-runner:
    image: prefecthq/prefect:3.9.0-python3.12@sha256:9f4fb20a431f0aba81bbcede83d5c08648aa769faf0ec47e989e9d370270129e
    restart: unless-stopped
    profiles: [demo]
    command: [python, /demo/demo.py, serve]
    environment:
      PREFECT_API_URL: http://server:4200/api
      PREFECT_HOME: /opt/prefect-demo
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "false"
      PREFECT_LOGGING_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./demo.py:/demo/demo.py:ro
      - ./demo-output:/demo-output
      - demo_data:/opt/prefect-demo
    depends_on:
      server:
        condition: service_healthy
    cpus: 2.0
    mem_limit: 3g

volumes:
  postgres_data:
  prefect_data:
  demo_data:
