networks:
    1panel-network:
        external: true
services:
    sub2api:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - AUTO_SETUP=true
            - SERVER_HOST=0.0.0.0
            - SERVER_PORT=8080
            - SERVER_MODE=${SERVER_MODE}
            - RUN_MODE=${RUN_MODE}
            - DATABASE_HOST=${PANEL_DB_HOST}
            - DATABASE_PORT=${PANEL_DB_PORT}
            - DATABASE_USER=${PANEL_DB_USER}
            - DATABASE_PASSWORD=${PANEL_DB_USER_PASSWORD}
            - DATABASE_DBNAME=${PANEL_DB_NAME}
            - DATABASE_SSLMODE=disable
            - REDIS_HOST=${PANEL_REDIS_HOST}
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${PANEL_REDIS_ROOT_PASSWORD}
            - REDIS_DB=0
            - ADMIN_EMAIL=${ADMIN_EMAIL}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRE_HOUR=24
            - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
            - TZ=${TZ}
            - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
        healthcheck:
            interval: 30s
            retries: 3
            start_period: 30s
            test:
                - CMD
                - wget
                - -q
                - -T
                - "5"
                - -O
                - /dev/null
                - http://localhost:8080/health
            timeout: 10s
        image: local/codex-route-isolation-router:859b963956b1
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8080
        restart: always
        volumes:
            - ./data:/app/data
