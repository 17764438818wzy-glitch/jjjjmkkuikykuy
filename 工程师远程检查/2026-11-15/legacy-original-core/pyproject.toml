[project]
name = "paperflow-local"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.2.15",
  "langgraph-checkpoint-sqlite==3.1.2",
  "deepseek-harness-sdk==0.1.5rc1",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "PyMuPDF==1.27.2.3",
  "Pillow==11.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
web = ["fastapi==0.136.3", "uvicorn==0.47.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["paperflow*", "webworkbench*"]

[tool.setuptools.package-data]
paperflow = ["*.mjs", "prompts/*.txt", "prompts/*.json", "prompts/*.yml"]
webworkbench = ["static/*.html", "static/*.css", "static/*.js"]
